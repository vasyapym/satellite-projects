[package]
name = "bigbang_rust"
version = "0.1.0"
edition = "2021"
description = "Physics core (Friedmann background + Barnes-Hut N-body) for the bigbang_rust satellite."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"